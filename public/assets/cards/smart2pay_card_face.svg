<svg width="1024" height="646" viewBox="0 0 1024 646" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Midnight Obsidian Card Background Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="1024" y2="646" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030814"/>
      <stop offset="40%" stop-color="#061224"/>
      <stop offset="85%" stop-color="#081830"/>
      <stop offset="100%" stop-color="#0A1E3C"/>
    </linearGradient>

    <!-- Brushed Platinum/Silver Chip Metallic Gradient -->
    <linearGradient id="chipMetal" x1="0" y1="0" x2="140" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#D1D5DB"/>
      <stop offset="50%" stop-color="#F3F4F6"/>
      <stop offset="75%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>

    <!-- Right Ambient Atmospheric Lighting -->
    <radialGradient id="rightGlow" cx="980" cy="340" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030814" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Base Slab -->
  <rect width="1024" height="646" rx="42" fill="url(#cardBg)"/>

  <!-- Right Ambient Lighting Glow -->
  <rect width="1024" height="646" rx="42" fill="url(#rightGlow)"/>

  <!-- ======================================================== -->
  <!-- GLOWING HARMONIC WAVE RIBBONS                            -->
  <!-- ======================================================== -->
  <g opacity="0.95">
    <!-- Wave line 1 -->
    <path d="M120 280 C260 140, 500 130, 720 280 C840 370, 940 440, 1024 450" stroke="#1E40AF" stroke-width="1.8" stroke-opacity="0.5" fill="none"/>
    <!-- Wave line 2 -->
    <path d="M130 270 C280 135, 520 125, 735 270 C855 360, 950 425, 1024 435" stroke="#2563EB" stroke-width="2.2" stroke-opacity="0.7" fill="none"/>
    <!-- Wave line 3 -->
    <path d="M140 260 C300 130, 540 120, 750 260 C870 350, 960 410, 1024 420" stroke="#38BDF8" stroke-width="2.8" stroke-opacity="0.9" fill="none"/>
    <!-- Wave line 4 -->
    <path d="M150 250 C320 125, 560 115, 765 250 C885 340, 970 395, 1024 405" stroke="#60A5FA" stroke-width="2.4" stroke-opacity="0.8" fill="none"/>
    <!-- Wave line 5 -->
    <path d="M160 240 C340 120, 580 110, 780 240 C900 330, 980 380, 1024 390" stroke="#93C5FD" stroke-width="1.8" stroke-opacity="0.6" fill="none"/>
    <!-- Wave line 6 -->
    <path d="M170 230 C360 115, 600 105, 795 230 C915 320, 990 365, 1024 375" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.5" fill="none"/>
    <!-- Wave line 7 -->
    <path d="M180 220 C380 110, 620 100, 810 220 C930 310, 1000 350, 1024 360" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>
    <!-- Wave line 8 -->
    <path d="M110 290 C240 145, 480 135, 705 290 C825 380, 930 455, 1024 465" stroke="#1D4ED8" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  </g>

  <!-- ======================================================== -->
  <!-- TOP RIGHT: SMART2PAY WORDMARK & TAGLINE                  -->
  <!-- ======================================================== -->
  <text x="940" y="105" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
    Smart<tspan fill="#38BDF8">2</tspan>Pay
  </text>
  <text x="940" y="136" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.5" fill="#94A3B8">
    Pay Smart. Live Smarter.
  </text>

  <!-- ======================================================== -->
  <!-- BRUSHED PLATINUM/SILVER EMV SMART CHIP                   -->
  <!-- ======================================================== -->
  <g transform="translate(85, 195)">
    <!-- Metallic Platinum Chip Base -->
    <rect width="140" height="110" rx="16" fill="url(#chipMetal)" stroke="#64748B" stroke-width="1.5"/>
    <!-- Specular Highlight Sheen -->
    <path d="M0 0 L140 0 L110 35 L0 35 Z" fill="#FFFFFF" fill-opacity="0.3"/>
    
    <!-- ISO/IEC Contact Separation Lines -->
    <path d="M70 0 L70 110" stroke="#334155" stroke-width="1.8"/>
    <path d="M0 37 L52 37" stroke="#334155" stroke-width="1.8"/>
    <path d="M88 37 L140 37" stroke="#334155" stroke-width="1.8"/>
    <path d="M0 73 L52 73" stroke="#334155" stroke-width="1.8"/>
    <path d="M88 73 L140 73" stroke="#334155" stroke-width="1.8"/>
    
    <!-- Center Capsule Pill Contact -->
    <rect x="46" y="24" width="48" height="62" rx="24" stroke="#334155" stroke-width="1.8" fill="none"/>
  </g>

  <!-- ======================================================== -->
  <!-- CONTACTLESS NFC WAVES (Concentric Arcs Radiating Right)  -->
  <!-- ======================================================== -->
  <g transform="translate(265, 250)">
    <path d="M0 -18 C12 -10, 12 10, 0 18" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M14 -28 C30 -15, 30 15, 14 28" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M28 -38 C48 -20, 48 20, 28 38" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95"/>
  </g>

  <!-- ======================================================== -->
  <!-- EMBOSSED CARD NUMBER (Farrington / OCR-A Style)          -->
  <!-- ======================================================== -->
  <text x="85" y="388" font-family="'Courier New', monospace" font-size="44" font-weight="bold" letter-spacing="6.5" fill="#F8FAFC">
    5412  8832  9014  8892
  </text>

  <!-- ======================================================== -->
  <!-- FOOTER: CARDHOLDER & VALID THRU WITH DIVIDER LINE        -->
  <!-- ======================================================== -->
  <g transform="translate(85, 470)">
    <!-- Left Column: Cardholder -->
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#60A5FA">
      CARDHOLDER
    </text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" letter-spacing="1" fill="#FFFFFF">
      MERCHANT SETTLEMENT
    </text>

    <!-- Vertical Divider Line -->
    <line x1="390" y1="-8" x2="390" y2="42" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Center Column: Valid Thru -->
    <text x="430" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#60A5FA">
      VALID THRU
    </text>
    <text x="430" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" letter-spacing="1" fill="#FFFFFF">
      12/29
    </text>
  </g>

  <!-- Bottom subtle rim highlight -->
  <rect x="400" y="642" width="224" height="4" rx="2" fill="#38BDF8" opacity="0.8"/>
</svg>
